<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <title>Lista de Actividades</title>
</head>
<body>
    <div class="caja">
        <div class="menu">
            <h1>Menu</h1>
            <ul>
                <li class="navegador"><a href="index.html">Lista de Actividades</a></li>
                <li class="navegador"><a href="crear-tareas.html">Crear Tarea</a></li>
                <li class="navegador"><a href="categorias.html">Gestion de Categoria</a></li>
            </ul>
        </div>

        <div class="main centrado">
                <h1>Crear Tarea</h1>

                <div class="crear_tarea">
                    <form class="formulario_tarea">
                        <label for="nombre">Titulo:</label>
                        <input type="text" class="input_nombre altura-6cp margin-top-10px">

                        <label for="descripcion">Descripción:</label>
                        <textarea name="descripcion" class="tarea-textarea altura-10cp margin-top-10px"></textarea>

                        <label for="date">Fecha:</label>
                        <input type="date" class="input_fecha altura-6cp margin-top-10px">

                        <label for="categoria">Categoria:</label>
                        <select class="select_categoria altura-6cp margin-top-10px">
                            <option value="">Crea una categoria</option>
                        </select>

                        <label for="prioridad">Prioridad:</label>
                        <select class="select_prioridad altura-6cp margin-top-10px">
                            <option value="">Seleccionar prioridad</option>
                            <option value="baja">Baja</option>
                            <option value="media">Media</option>
                            <option value="alta">Alta</option>
                        </select>

                        <button class="boton_tarea">Crear Tarea</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
